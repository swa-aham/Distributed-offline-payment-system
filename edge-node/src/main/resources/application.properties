# Override this when starting: --server.port=8081 --edge.node.id=edge-node-1
server.port=${PORT:8081}
spring.application.name=edge-node

edge.node.id=edge-node-1
edge.node.owner.vpa=alice@upi

# Central backend URL
backend.url=${BACKEND_URL:http://localhost:8080}
# Sync interval in seconds (how often to try flushing the outbox)
sync.interval.seconds=10

# Retry config
retry.max.attempts=5
retry.initial.backoff.ms=1000
retry.backoff.multiplier=2

# Offline mode simulation: set to true to stop syncing (simulates no internet)
offline.mode=false

# H2 local outbox queue (persists across restarts within the same session)
spring.datasource.url=jdbc:h2:mem:edgeoutbox;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Logging
logging.pattern.console=%d{HH:mm:ss} [${edge.node.id}] %-5level %logger{20} - %msg%n
