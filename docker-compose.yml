version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: upi_postgres
    environment:
      POSTGRES_DB: offlineupi
      POSTGRES_USER: upiuser
      POSTGRES_PASSWORD: upipass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: upi_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
